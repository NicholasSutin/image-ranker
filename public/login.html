<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enter code</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login">
    <form id="form" autocomplete="off">
      <section id="who-invite" hidden>
        <h1>Are you <span id="invite-name"></span>?</h1>
        <p>Just so we know whose picks these are.</p>
        <div class="who-buttons">
          <button type="button" class="primary-btn" id="who-yes">Yes, that's me</button>
          <button type="button" class="link-btn" id="who-no">No, I'm someone else</button>
        </div>
      </section>
      <section id="who-name" hidden>
        <h1>What's your name?</h1>
        <p>So we know whose picks these are.</p>
        <input class="name-input" id="name" autocomplete="name" autocapitalize="words" maxlength="40" placeholder="Your name" aria-label="Your name">
        <button type="submit" class="primary-btn" id="name-next">Continue</button>
      </section>
      <section id="code-step" hidden>
        <p class="hello">Hi <strong id="hello-name"></strong> · <button type="button" class="link-btn" id="not-me">not you?</button></p>
        <h1>Enter code</h1>
        <p>5 digits</p>
        <div class="digits" id="digits">
          <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
          <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
          <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
          <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
          <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
        </div>
      </section>
      <div id="turnstile"></div>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
</body>
</html>
