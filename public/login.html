<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login">
    <form id="form" autocomplete="off">
      <h1>Sign in</h1>
      <p>Enter your name and the 5-digit code.</p>
      <label class="field" for="name">Name</label>
      <input class="name-input" id="name" autocomplete="name" autocapitalize="words" maxlength="40" placeholder="Your name">
      <span class="field" id="code-label">Code</span>
      <div class="digits" id="digits" role="group" aria-labelledby="code-label">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
      </div>
      <div id="turnstile"></div>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
</body>
</html>
